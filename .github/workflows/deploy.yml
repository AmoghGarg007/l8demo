name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two production deploys at once.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  # Not secrets — safe to commit. l8demo Vercel project (separate from the
  # official Layer8 site). From `vercel link` -> .vercel/project.json.
  VERCEL_ORG_ID: team_HxgrLhDZdv1X4ZtP9rGcloho
  VERCEL_PROJECT_ID: prj_2cxpTUmLbGkS2xDLoT7wvLxIDi4t

jobs:
  deploy:
    runs-on: ubuntu-latestg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
