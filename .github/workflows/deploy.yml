name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two production deploys at once.
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  # Not secrets — safe to commit. From .vercel/project.json.
  VERCEL_ORG_ID: team_HxgrLhDZdv1X4ZtP9rGcloho
  VERCEL_PROJECT_ID: prj_7kEB4qfoaJhnVdRxwOhygMiTvrKy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee deployment-url.txt

      - name: Point canonical domain at this deploy
        run: |
          vercel alias set "$(tail -n1 deployment-url.txt)" layer8ecc.vercel.app \
            --token=${{ secrets.VERCEL_TOKEN }}
